name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression checks (offline generation and editing)
        run: python verify_demo.py
      - name: Panel-transfer geometry check
        run: |
          mkdir -p runs
          curl -L https://www.jmlr.org/papers/volume9/vandermaaten08a/vandermaaten08a.pdf -o runs/tsne-jmlr.pdf
          python verify_panel_transfer.py runs/tsne-jmlr.pdf --out runs/tsne-transfer
