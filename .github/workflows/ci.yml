name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression checks (offline generation and editing)
        run: python verify_demo.py
      # Best-effort: this check needs an external 3.5 MB paper from jmlr.org,
      # which can be blocked from GitHub's datacenter IPs. It is hard-gated
      # locally via `python verify_panel_transfer.py runs/tsne-jmlr.pdf --out runs/tsne-transfer`.
      - name: Panel-transfer geometry check (best effort, needs external paper)
        continue-on-error: true
        run: |
          mkdir -p runs
          if curl --fail --retry 3 --retry-all-errors -A "Mozilla/5.0 (PaperCanvas CI)" -L \
              https://www.jmlr.org/papers/volume9/vandermaaten08a/vandermaaten08a.pdf -o runs/tsne-jmlr.pdf \
              && head -c 4 runs/tsne-jmlr.pdf | grep -q '%PDF'; then
            python verify_panel_transfer.py runs/tsne-jmlr.pdf --out runs/tsne-transfer
          else
            echo "Skipping panel-transfer check: could not download the source paper."
          fi
