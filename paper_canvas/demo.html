<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="studio-token" content="{{TOKEN}}"><meta name="live" content="{{LIVE}}">
<title>PaperCanvas · 海报工作台</title><link href="/studio.css" rel="stylesheet"><script defer src="/studio.js"></script></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true"></span>PaperCanvas</div><span class="mode" id="mode"></span></header>
<main><div class="mast"><div><p class="crumb">PaperCanvas / 工作台</p><h1>论文海报工作台</h1></div><div class="tools"><a class="secondary" href="/posterforest">PosterForest 对照</a> <button id="new" class="secondary">＋ 导入论文</button></div></div>
<dialog id="input"><form id="paperform"><div class="split"><h2>选择论文</h2><button type="button" class="plain" id="close">关闭</button></div>
<label>论文来源<select id="sample"><option value="retrieval">合成示例 · 检索方法对照（2 页）</option><option value="field">合成示例 · 双人标注（1 页）</option>{{OPEN_PAPER}}<option value="upload">上传自己的 PDF</option></select></label>
<label hidden id="upload">英文文本型 PDF（最多 16 MB）<input type="file" id="file" accept=".pdf,application/pdf"></label>
<div class="pair"><label>宽度（pt）<input id="width" type="number" value="1008" min="144" max="4032" required></label><label>高度（pt）<input id="height" type="number" value="540" min="144" max="4032" required></label></div><p id="inputNote" class="hint"></p><p id="importError" role="alert"></p><button class="primary" id="generate">生成海报</button></form></dialog>
<nav aria-label="工作视图"><button data-tab="poster" aria-current="page">海报编辑</button><button data-tab="sources">论文证据</button><button data-tab="compare">策略对照</button><button data-tab="history">修订记录</button></nav>
<p id="status" role="status" aria-live="polite">正在打开工作台…</p>
<section id="poster" class="view"><div class="layout"><article class="card"><div class="cardhead"><div><small>当前海报</small><h2 id="title">载入中</h2></div><a id="download" class="secondary" hidden download="PaperCanvas.pptx">↓ PPTX</a></div>
<div class="stage"><img id="preview" alt="当前已接受的海报" hidden></div><div class="metrics" id="metrics"></div></article>
<aside class="card editor"><h2>编辑请求</h2><label>操作<select id="op"><option value="enlarge">放大证据图</option><option value="shorten">缩短段落</option><option value="protect">锁定段落</option><option value="custom">输入指令</option></select></label>
<label id="targetWrap" hidden>目标段落<select id="target"><option value="question">研究问题</option><option value="method">方法</option><option value="result">主要结果</option></select></label>
<label id="gainWrap"><span class="split">增加图宽 <b id="gainText">35%</b></span><input id="gain" type="range" min="5" max="80" step="5" value="35"></label>
<label id="wordsWrap" hidden>最多保留词数<input id="words" type="number" min="1" max="150" value="12"></label>
<label class="check" id="lockWrap"><input type="checkbox" id="lock" checked>同时锁定结果文字</label>
<label id="customWrap" hidden>请求<textarea id="request" rows="3" placeholder="shorten protected section to 2 words"></textarea></label><button class="primary" id="apply">应用修改</button>
<div id="feedback" aria-live="polite"></div><div id="locks"></div></aside></div></section>
<section id="sources" class="view" hidden><div class="layout evidence"><article class="card"><div class="cardhead"><h2>论文原页</h2><span id="pageLabel"></span></div><div class="paperstage"><div class="pagephoto"><img id="sourcePage" alt="论文原页"><div id="crop" hidden></div></div></div></article><aside class="card editor"><h2>证据索引</h2><div id="evidenceList"></div><div id="citation"></div></aside></div></section>
<section id="compare" class="view card padded" hidden><div class="split"><div><h2>同一初稿，两种策略</h2><p class="hint">从当前海报分别执行同一请求，两次试验均保留原稿。</p></div><button id="compareRun" class="primary">运行对照</button></div><p id="comparePrompt"></p><div id="branches" class="pair"></div></section>
<section id="history" class="view" hidden><div class="layout"><article class="card"><div class="cardhead"><h2 id="historyTitle">候选版本</h2><span id="versionLabel"></span></div><div class="stage"><img id="oldPreview" alt="选中的历史版本"></div><div id="historyReason" class="summary"></div></article><aside class="card editor"><h2>决策轨迹</h2><div id="timeline"></div></aside></div></section>
</main></body></html>
