<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperCanvas · 布局树编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#18332f;font:16px/1.55 system-ui,sans-serif}header{padding:16px 3vw;background:#193c36;color:white}h1{margin:0;font-size:1.3rem}main{display:grid;grid-template-columns:minmax(15rem,21rem) 1fr;gap:24px;padding:24px 3vw}form,figure{margin:0;padding:20px;background:white;align-self:start}label{display:block;font-weight:600;margin-bottom:6px}select,input,button{font:inherit;width:100%;padding:8px;margin-bottom:12px}button{background:#196b5c;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}a{color:#13564a}img{max-width:100%;display:block}p{overflow-wrap:anywhere}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
<header><h1>PaperCanvas · 布局树编辑器</h1></header><main>
<form><label for="branch">论文分支</label><select id="branch"></select><p id="children"></p>
<label id="share" for="ratio">第一部分占比（%）</label><input id="ratio" type="number" step="any" required min=".01" max="99.99">
<button disabled>调整并检查海报</button>
<div id="joint" hidden><label for="request">内容与版式修改要求</label>
<textarea id="request" rows="4" style="width:100%;font:inherit"></textarea>
<button type="button" id="revise">按要求修改并复核</button></div>
<a id="download">下载当前 PowerPoint</a><p id="status" role="status"></p></form>
<figure><img id="preview" alt="当前单页海报"></figure></main>
<script>
const get=id=>document.getElementById(id), branch=get("branch"), ratio=get("ratio"), statusText=get("status"), button=document.querySelector("button");
let current;
function selection(){
 const n=current.branches.find(b=>b.id===branch.value);
 if(!n){get("children").textContent="此海报只有一个面板。";return}
 const horizontal=n.direction==="horizontal";
 get("children").textContent=(horizontal?"上":"左")+" · "+n.first+" ／ "+(horizontal?"下":"右")+" · "+n.second;
 get("share").textContent=(horizontal?"上方":"左侧")+"分支占比（%）";
 ratio.value=Number((100*n.ratio).toFixed(4));
}
function display(data){
 const selected=branch.value;current=data;branch.replaceChildren();
 for(const n of data.branches){const option=document.createElement("option");option.value=n.id;option.textContent=n.first+" ↔ "+n.second;branch.append(option)}
 if(data.branches.some(n=>n.id===selected))branch.value=selected;
 selection();button.disabled=!branch.length;get("joint").hidden=!data.live;
 const base="/tree/file/"+data.artifact+"/";get("preview").src=base+"preview.png";get("download").href=base+"poster.pptx";
}
branch.onchange=selection;
async function submitEdit(path,change){
 button.disabled=true;get("revise").disabled=true;statusText.textContent="正在修改并检查海报…";
 try{const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Canvas-Token":"{{TOKEN}}"},
 body:JSON.stringify({artifact:current.artifact,...change})});const d=await r.json();if(!r.ok)throw Error(d.error);
 display(d);statusText.textContent="已保存。"}catch(e){statusText.textContent=e.message}finally{button.disabled=!branch.length;get("revise").disabled=false}
}
document.querySelector("form").onsubmit=e=>{
 e.preventDefault();submitEdit("/tree/resize",{node:branch.value,ratio:Number(ratio.value)/100})
};
get("revise").onclick=()=>{const request=get("request").value.trim();if(request)submitEdit("/tree/revise",{request})};
fetch("/tree/state").then(r=>r.json()).then(display).catch(e=>statusText.textContent=e.message);
</script></html>
